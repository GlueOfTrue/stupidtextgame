name: Extract YouTube subtitles (one-off)
on:
  push:
    branches: ['tools/extract-subs-AH44i-iJnis']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install Python transcript client
        run: python -m pip install -U youtube-transcript-api
      - name: Query transcript API
        run: |
          cat > /tmp/collect.py <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi
          from pathlib import Path
          import json
          VID="AH44i-iJnis";out=Path("captions");out.mkdir(exist_ok=True)
          api=YouTubeTranscriptApi()
          try:
           tracks=api.list(VID)
           print("TRACKS",[(x.language_code,x.is_generated) for x in tracks],flush=True)
          except Exception as e:print("LIST ERROR",repr(e)[:1400],flush=True)
          for lang in ("ru","en"):
           try:
            t=api.fetch(VID,languages=[lang])
            p=out/f"{VID}.{lang}.json"
            p.write_text(json.dumps(t.to_raw_data(),ensure_ascii=False,indent=2),encoding="utf-8")
            print("SUCCESS",p,len(t),flush=True)
           except Exception as e:print("FETCH ERROR",lang,repr(e)[:1600],flush=True)
          
          PY
          python /tmp/collect.py
      - name: Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AH44i-iJnis-transcripts
          path: captions/
          if-no-files-found: warn
