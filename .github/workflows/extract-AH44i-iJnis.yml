name: Extract YouTube subtitles (one-off)
on:
  push:
    branches: ['tools/extract-subs-AH44i-iJnis']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check video metadata and audio
        run: |
          cat > /tmp/collect.py <<'PY'
          import requests,json
          vid="AH44i-iJnis"
          base="https://inv.nadeko.net"
          urls=[base+"/api/v1/videos/"+vid,base+"/watch?v="+vid,base+"/latest_version?id="+vid+"&itag=140&local=true"]
          for u in urls:
           try:
            r=requests.get(u,timeout=18,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-1023"},stream=True)
            print("URL",r.status_code,r.url,dict(r.headers),flush=True)
            if "application/json" in r.headers.get("Content-Type",""):
             d=r.json()
             print("META",d.get("title"),d.get("lengthSeconds"),d.get("captions"),flush=True)
             for k in ("adaptiveFormats","formatStreams","hlsUrl","dashUrl"):
              v=d.get(k,[]);print("KEY",k,str(v)[:3600],flush=True)
            else: print("SAMPLE",repr(next(r.iter_content(512),b"")[:120]),flush=True)
           except Exception as e:print("ERROR",str(e)[:200],flush=True)
          
          PY
          python /tmp/collect.py
