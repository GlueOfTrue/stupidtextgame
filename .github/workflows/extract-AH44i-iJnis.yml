name: Extract YouTube subtitles (one-off)
on:
  push:
    branches: ['tools/extract-subs-AH44i-iJnis']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query transcript endpoints
        run: |
          cat > /tmp/collect.py <<'PY'
          import requests,os,concurrent.futures,json
          vid="AH44i-iJnis";os.makedirs("captions",exist_ok=True)
          urls=[
          "https://inv.nadeko.net/api/v1/transcripts/"+vid+"?lang=ru&autogen",
          "https://inv.nadeko.net/api/v1/transcripts/"+vid+"?lang=ru",
          "https://inv.nadeko.net/api/v1/transcripts/"+vid,
          "https://inv.nadeko.net/api/v1/captions/"+vid+"?lang=ru",
          "https://inv.nadeko.net/api/v1/captions/"+vid+"?label=Russian%20%28auto-generated%29",
          "https://invidious.nerdvpn.de/api/v1/transcripts/"+vid+"?lang=ru&autogen",
          "https://yt.chocolatemoo53.com/api/v1/transcripts/"+vid+"?lang=ru&autogen",
          "https://www.youtube.com/api/timedtext?type=list&v="+vid,
          "https://video.google.com/timedtext?type=list&v="+vid
          ]
          def work(iu):
           i,url=iu
           try:
            r=requests.get(url,timeout=13,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/vtt,*/*"})
            print("RESULT",i,r.status_code,len(r.content),r.url,repr(r.text[:800]),flush=True)
            if r.ok and len(r.content)>1000 and any(x in r.text[:5000] for x in ["WEBVTT","transcript","tStartMs","-->", "segments"]):
             p=f"captions/{vid}.attempt{i}.txt";open(p,"w").write(r.text)
             print("SAVED",p,flush=True)
           except Exception as e: print("ERROR",i,str(e)[:200],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=9) as e:list(e.map(work,enumerate(urls)))
          print("FILES",os.listdir("captions"),flush=True)
          PY
          python /tmp/collect.py
      - name: Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AH44i-iJnis-transcripts
          path: captions/
          if-no-files-found: warn
